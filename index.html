<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>School Portal Loading...</title>
    <style>
        /* CSS কালার স্কিম এবং স্টাইল */
        :root {
            --bg-color: #1B5B6B; /* ব্যাকগ্রাউন্ড কালার */
            --accent-color: #f39c12; /* সোনালী-কমলা অ্যাকসেন্ট */
            --text-light: #ffffff; /* সাদা লেখা */
            --spinner-base: rgba(255, 255, 255, 0.2); 
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* লোডার স্ক্রিন */
        #loader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        /* গোলাকার এবং অ্যানিমেটেড লোগো কন্টেইনার */
        .logo-container {
            width: 130px;
            height: 130px;
            margin-bottom: 30px;
            background-image: url('imresizer-unnamed_(1).png'); 
            background-size: cover; /* লোগোটি পুরো বৃত্ত জুড়ে থাকবে */
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff; /* বৃত্তের ভেতরে সাদা ব্যাকগ্রাউন্ড */
            border-radius: 50%; /* লোগোটিকে পুরোপুরি গোলাকার করার জন্য */
            border: 4px solid var(--accent-color); /* লোগোর চারপাশে সোনালী বর্ডার */
            animation: pulseLogo 2s infinite ease-in-out; /* পালস অ্যানিমেশন */
        }

        /* লোগোর পালস অ্যানিমেশন (ছোট-বড় হওয়া এবং আভা ছড়ানো) */
        @keyframes pulseLogo {
            0% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.7); 
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 0 20px 15px rgba(243, 156, 18, 0); 
            }
            100% { 
                transform: scale(1); 
                box-shadow: 0 0 0 0 rgba(243, 156, 18, 0); 
            }
        }

        /* প্রফেশনাল রাউন্ড স্পিনার */
        .school-spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 4px solid var(--spinner-base); 
            border-top: 4px solid var(--accent-color); 
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 25px;
            font-size: 18px;
            color: var(--text-light);
            text-align: center;
            padding: 0 20px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            font-weight: 500;
        }

        /* Google Apps Script Iframe */
        #portal-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; 
        }
    </style>
</head>
<body>

    <!-- লোডার স্ক্রিন -->
    <div id="loader-screen">
        <div class="logo-container"></div>
        <div class="school-spinner"></div>
        <div class="loading-text">
            অনুগ্রহ করে অপেক্ষা করুন... <br>
            Dhainagar High School (H.S.) Marks Entry পোর্টাল লোড হচ্ছে...
        </div>
    </div>

    <!-- আইফ্রেম যা Apps Script লোড করবে -->
    <iframe id="portal-iframe" 
            src="https://script.google.com/macros/s/AKfycbxa2A1UmbhM8GjvK35TTprHydAwar-Hcp4PWG7UdZo6wJE8eWr1hqX5It6C0FOwT3PWyQ/exec" 
            onload="portalLoaded()">
    </iframe>

    <script>
        function portalLoaded() {
            var loaderScreen = document.getElementById('loader-screen');
            var portalIframe = document.getElementById('portal-iframe');

            // লোডার স্ক্রিন ফেইড আউট করুন
            loaderScreen.style.opacity = '0';
            
            // ট্রানজিশন মসৃণ করার জন্য ছোট্ট টাইমআউট
            setTimeout(function() {
                loaderScreen.style.display = 'none';
                portalIframe.style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
